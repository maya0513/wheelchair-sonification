<line x1="243" y1="100" x2="200" y2="86" stroke="black"/>
<text x="520" y="80" font-size="16" font-family='Noto Sans CJK JP, sans-serif'>右手首トラッカー</text>
<line x1="517" y1="100" x2="556" y2="86" stroke="black"/>
<text x="416" y="90" font-size="16" font-family='Noto Sans CJK JP, sans-serif'>ヘッドセット（提示・保存）</text>
<line x1="406" y1="95" x2="420" y2="92" stroke="black"/>
<text x="380" y="385" font-size="15" text-anchor="middle" font-family='Noto Sans CJK JP, sans-serif'>上面模式図：トラッカー5台（左右車輪・車体・両手首）</text>
