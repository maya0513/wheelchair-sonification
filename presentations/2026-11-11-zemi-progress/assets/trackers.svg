<line x1="495" y1="107" x2="430" y2="130" stroke="black" stroke-width="1.2"/>
<!-- labels -->
<text x="120" y="210" font-size="16" font-family='Noto Sans CJK JP, sans-serif'>左車輪トラッカー</text>
<line x1="212" y1="212" x2="196" y2="212" stroke="black"/>
<text x="552" y="210" font-size="16" font-family='Noto Sans CJK JP, sans-serif'>右車輪トラッカー</text>
<line x1="548" y1="212" x2="566" y2="212" stroke="black"/>
<text x="398" y="272" font-size="16" font-family='Noto Sans CJK JP, sans-serif'>車体トラッカー</text>
